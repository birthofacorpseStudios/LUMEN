name: Build LUMEN APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Unzip FULL LUMEN
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found $ZIP"
          unzip -o "$ZIP" -d .
          ls -la LUMEN_APK

      - name: Fix gradle files for FULL build
        run: |
          cd LUMEN_APK
          cat > settings.gradle << 'SET'
          pluginManagement {
            repositories { google(); gradlePluginPortal(); mavenCentral() }
            plugins {
              id 'com.android.application' version '8.2.2'
              id 'org.jetbrains.kotlin.android' version '1.9.22'
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          SET
          cat > build.gradle << 'BLD'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          BLD
          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.lumen.app'
            compileSdk 34
            defaultConfig { applicationId "com.lumen.app"; minSdk 26; targetSdk 34; versionCode 7; versionName "7.0-Full-Offline" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.compose.material3:material3:1.1.2'
            implementation 'androidx.compose.ui:ui:1.5.8'
            implementation 'androidx.compose.runtime:runtime:1.5.8'
            implementation 'androidx.activity:activity-compose:1.8.2'
          }
          APP

      - name: Build FULL APK
        run: |
          cd LUMEN_APK
          gradle assembleDebug --stacktrace

      - name: Upload FULL APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-FULL-V7-direct-install
          path: LUMEN_APK/app/build/outputs/apk/debug/app-debug.apk
