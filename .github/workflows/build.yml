name: Build LUMEN APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Unzip project
        run: |
          ls
          ZIP=$(find . -name "*.zip" | head -n 1)
          unzip -o "$ZIP"
          ls LUMEN_APK
      - name: Build APK
        run: |
          cd LUMEN_APK
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-direct-install-apk
          path: LUMEN_APK/app/build/outputs/apk/debug/app-debug.apk
