name: Build LUMEN APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Create working Android project (always builds)
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/lumen/app

          cat > settings.gradle << 'SET'
          pluginManagement {
            repositories {
              google()
              gradlePluginPortal()
              mavenCentral()
            }
            plugins {
              id 'com.android.application' version '8.2.2'
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          SET

          cat > build.gradle << 'BLD'
          // root
          BLD

          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.lumen.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.lumen.app"
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName "7.0"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          APP

          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="LUMEN" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MAN

          cat > app/src/main/java/com/lumen/app/MainActivity.java << 'JAVA'
          package com.lumen.app;
          import android.app.Activity; import android.os.Bundle; import android.widget.TextView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              TextView tv = new TextView(this);
              tv.setPadding(40,80,40,40);
              tv.setTextSize(18);
              tv.setText("LUMEN V7 OFFLINE\n\nDirect install build WORKS!\n\nThis is the test APK.\nNext we add full 30 icons + Dreams logic.");
              setContentView(tv);
            }
          }
          JAVA

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK for direct install
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-direct-install-apk
          path: app/build/outputs/apk/debug/app-debug.apk
