name: Build LUMEN APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - uses: android-actions/setup-android@v3
      
      - uses: gradle/actions/setup-gradle@v3

      - name: Show what you uploaded
        run: |
          ls -la
          find . -type f -name "*.zip" -o -name "gradlew" | head -20

      - name: Unzip if you uploaded the zip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -o "$ZIP" -d .
          fi
          ls -la
          ls -la LUMEN_APK || true

      - name: Build APK
        run: |
          if [ -d "LUMEN_APK/app" ]; then
            cd LUMEN_APK
            gradle assembleDebug --stacktrace
          elif [ -d "app" ]; then
            gradle assembleDebug --stacktrace
          else
            echo "No project found"
            exit 1
          fi

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Upload APK for direct install
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-direct-install-apk
          path: "**/*.apk"
