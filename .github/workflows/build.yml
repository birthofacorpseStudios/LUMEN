name: Build LUMEN APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Download LUMEN project
        run: |
          curl -L -o lumen.zip "https://cdn.fbsbx.com/v/t65.102178-21/786810850_1360303879153266_6802190910515753546_n.jpg/LUMEN_GITHUB_FOLDER_FIX.zip?_nc_ht=cdn.fbsbx.com&_nc_ohc=i9McI5GfwpAQ7kNvwGYTwFf&sdl=1&ccb=14-4&oh=00_AQHeJfrVnYClNhBQik15yc1VbHtEl7OOGEMLSA-7t2fbsQ&oe=6A8F2AB7&_nc_sid=4ee932"
          unzip lumen.zip
          ls
      - name: Build APK
        run: |
          cd LUMEN_APK
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-direct-install-apk
          path: LUMEN_APK/app/build/outputs/apk/debug/app-debug.apk
